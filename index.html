<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ammo's Site Treasury</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #080b10;
            color: #e2e8f0;
        }

        /* Custom Glowing Text Effect */
        .glow-title {
            color: #38bdf8;
            text-shadow: 
                0 0 10px rgba(56, 189, 248, 0.6),
                0 0 20px rgba(56, 189, 248, 0.4),
                0 0 30px rgba(56, 189, 248, 0.2);
        }

        /* Glowing Button & Elements */
        .glow-btn {
            border: 1px solid rgba(56, 189, 248, 0.5);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
            transition: all 0.25s ease;
        }

        .glow-btn:hover {
            background-color: rgba(56, 189, 248, 0.15);
            border-color: #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
            transform: translateY(-1px);
        }

        .glow-btn-copied {
            border-color: #34d399 !important;
            box-shadow: 0 0 20px rgba(52, 211, 153, 0.6) !important;
            background-color: rgba(52, 211, 153, 0.15) !important;
            color: #34d399 !important;
        }

        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.08);
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            border-color: rgba(56, 189, 248, 0.5);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37), 0 0 18px rgba(56, 189, 248, 0.25);
            transform: translateY(-3px);
        }

        .game-card-outline {
            border: 1px solid rgba(56, 189, 248, 0.4);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.15);
        }

        .game-card-outline:hover {
            border-color: #38bdf8;
            box-shadow: 0 0 22px rgba(56, 189, 248, 0.4);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #080b10;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #38bdf8;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center relative overflow-x-hidden">

    <!-- Background Ambient Glows -->
    <div class="fixed -top-40 -left-40 w-96 h-96 bg-sky-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="fixed -bottom-40 -right-40 w-96 h-96 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Floating Navigation Bar / Controls -->
    <div class="fixed top-6 left-6 z-40 flex items-center gap-3">
        <button id="nav-left-btn" onclick="slidePage(0)" class="glow-btn p-3 rounded-2xl bg-slate-900/80 text-sky-400 flex items-center justify-center gap-2 cursor-pointer shadow-lg backdrop-blur-md">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
            <span class="text-xs font-semibold hidden md:inline"> Treasury</span>
        </button>

        <button id="nav-right-btn" onclick="slidePage(1)" class="glow-btn p-3 rounded-2xl bg-slate-900/80 text-sky-400 flex items-center justify-center gap-2 cursor-pointer shadow-lg backdrop-blur-md">
            <span class="text-xs font-semibold hidden md:inline">Popular Games</span>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
            </svg>
        </button>
    </div>

    <!-- Sliding Canvas Viewport -->
    <div class="w-full overflow-hidden flex-1 flex flex-col justify-center">
        <div id="slider-track" class="flex w-[200%] transition-transform duration-500 ease-in-out">
            
            <!-- PAGE 1: Ammo's Site Treasury -->
            <section class="w-[50%] min-h-screen p-4 sm:p-6 lg:p-10 flex flex-col justify-center items-center">
                <main class="w-full max-w-4xl mx-auto pt-16 sm:pt-10">
                    <!-- Header Section -->
                    <header class="text-center my-6 sm:my-10">
                        <h1 class="text-4xl sm:text-5xl md:text-6xl font-extrabold tracking-tight glow-title mb-3">
                            Ammo's Site Treasury
                        </h1>
                        <p class="text-slate-400 text-sm sm:text-base max-w-md mx-auto">
                            Quick access vault for link storage and one-click clipboard copying.
                        </p>
                    </header>

                    <!-- Link Status Indicator Note -->
                    <div class="mb-4 px-2 py-2.5 rounded-xl bg-slate-900/50 border border-sky-500/20 flex items-center gap-2.5 text-xs text-slate-300 backdrop-blur-sm">
                        <span class="inline-block w-2.5 h-2.5 rounded-full bg-sky-400 shadow-[0_0_10px_#38bdf8] shrink-0"></span>
                        <span>Links with a blue dot on the left indicate that they are currently working.</span>
                    </div>

                    <!-- Treasury Links Container -->
                    <div id="treasury-list" class="space-y-4">
                        <!-- Rendered via JS -->
                    </div>
                </main>
            </section>

            <!-- PAGE 2: Most Popular Games -->
            <section class="w-[50%] min-h-screen p-4 sm:p-6 lg:p-10 flex flex-col justify-center items-center">
                <main class="w-full max-w-5xl mx-auto pt-16 sm:pt-10">
                    <!-- Header Section -->
                    <header class="text-center my-6 sm:my-10">
                        <h1 class="text-4xl sm:text-5xl md:text-6xl font-extrabold tracking-tight glow-title mb-3">
                            Most Popular Games
                        </h1>
                        <p class="text-slate-400 text-sm sm:text-base max-w-md mx-auto">
                            Recommended games to play
                        </p>
                    </header>

                    <!-- Games Grid Container -->
                    <div id="games-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        <!-- Rendered via JS -->
                    </div>
                </main>
            </section>

        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 bg-slate-900/90 border border-sky-400/50 text-sky-300 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 translate-y-20 opacity-0 transition-all duration-300 z-50">
        <svg class="w-5 h-5 text-sky-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
        <span id="toast-message" class="text-sm font-medium">Link copied to clipboard!</span>
    </div>

    <!-- Footer -->
    <footer class="my-6 text-center text-xs text-slate-500 z-10">
        &copy; Ammo's Site Treasury &bull; Sleek Dark Vault Interface
    </footer>

            {

            },

        // Page Slider Functionality
        let currentPage = 0;
        function slidePage(pageIndex) {
            currentPage = pageIndex;
            const track = document.getElementById('slider-track');
            track.style.transform = `translateX(-${pageIndex * 50}%)`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Render Page 1 (Sites List)
        function renderSites() {
            const container = document.getElementById('treasury-list');
            container.innerHTML = '';

            siteList.forEach((site) => {
                const card = document.createElement('div');
                card.className = "glass-card rounded-2xl p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4";
                
                card.innerHTML = `
                    <div class="flex-1 min-w-0 pr-2">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="inline-block w-2.5 h-2.5 rounded-full bg-sky-400 shadow-[0_0_10px_#38bdf8] shrink-0"></span>
                            <h2 class="text-sm font-semibold text-slate-200 tracking-wide truncate">${site.name}</h2>
                        </div>
                        <p class="text-xs sm:text-sm font-mono text-slate-400 truncate hover:text-slate-300 transition-colors">
                            ${site.url}
                        </p>
                    </div>

                    <div class="flex items-center gap-2 shrink-0">
                        <a href="${site.url}" target="_blank" rel="noopener noreferrer" 
                           title="Visit Site"
                           class="p-2.5 rounded-xl bg-slate-800/80 text-slate-400 hover:text-sky-300 hover:bg-slate-800 border border-slate-700/60 transition-all flex items-center justify-center">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                            </svg>
                        </a>

                        <button onclick="copyToClipboard('${site.url}', this)" 
                                class="glow-btn px-4 py-2.5 rounded-xl bg-slate-900/90 text-sky-400 font-medium text-xs sm:text-sm flex items-center gap-2 cursor-pointer select-none">
                            <svg class="w-4 h-4 icon-copy" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                            </svg>
                            <span class="btn-text">Copy URL</span>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Render Page 2 (Games Grid)
        function renderGames() {
            const container = document.getElementById('games-grid');
            container.innerHTML = '';

            gameList.forEach((game) => {
                const card = document.createElement('div');
                card.className = "game-card-outline bg-slate-900/60 rounded-2xl overflow-hidden backdrop-blur-md flex flex-col transition-all duration-300 transform hover:-translate-y-1.5";

                card.innerHTML = `
                    <div class="relative w-full h-48 bg-slate-950 overflow-hidden flex items-center justify-center">
                        <img src="${game.img}" alt="${game.title}" 
                             onerror="this.onerror=null; this.src='https://placehold.co/600x400/0f172a/38bdf8?text=Game+Image';"
                             class="w-full h-full object-cover transition-transform duration-500 hover:scale-105" />
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent to-transparent"></div>
                    </div>
                    <div class="p-4 flex flex-col justify-between flex-1">
                        <h3 class="text-base font-bold text-slate-100 truncate">${game.title}</h3>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Clipboard Copy Logic
        function copyToClipboard(text, btnElement) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text)
                    .then(() => handleSuccess(btnElement))
                    .catch(() => fallbackCopy(text, btnElement));
            } else {
                fallbackCopy(text, btnElement);
            }
        }

        function fallbackCopy(text, btnElement) {
            try {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.left = "-999999px";
                textArea.style.top = "-999999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                const successful = document.execCommand('copy');
                document.body.removeChild(textArea);
                if (successful) {
                    handleSuccess(btnElement);
                } else {
                    showToast("Failed to copy link");
                }
            } catch (err) {
                showToast("Failed to copy link");
            }
        }

        function handleSuccess(btnElement) {
            const btnText = btnElement.querySelector('.btn-text');
            btnElement.classList.add('glow-btn-copied');
            btnText.textContent = "Copied!";

            showToast("Copied to clipboard!");

            setTimeout(() => {
                btnElement.classList.remove('glow-btn-copied');
                btnText.textContent = "Copy URL";
            }, 2000);
        }

        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            
            toastMsg.textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        window.onload = function() {
            renderSites();
            renderGames();
        };
    </script>
</body>
</html>
